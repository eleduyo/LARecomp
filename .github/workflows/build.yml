name: Build LARecomp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout LARecomp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        shell: pwsh
        run: |
          choco install llvm cmake ninja -y
          clang++ --version
          cmake --version
          ninja --version

      - name: Download ReXGlue SDK 0.10.0
        shell: pwsh
        run: |
          $url = 'https://github.com/rexglue/rexglue-sdk/releases/download/v0.10.0/rexglue-sdk-0.10.0-win-amd64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'rexglue-sdk.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'rexglue-sdk'
          Invoke-WebRequest -Uri $url -OutFile $zip

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ad4485da853fbe932e9f5dbb643f9b5fe85dc73775ebbad4df6879fe6df0c11b') {
            throw "ReXGlue SDK checksum mismatch: $hash"
          }

          Remove-Item $sdk -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath $sdk -Force

          $rexglue = Get-ChildItem $sdk -Filter 'rexglue.exe' -Recurse | Select-Object -First 1
          $config = Get-ChildItem $sdk -Filter 'rexglueConfig.cmake' -Recurse | Select-Object -First 1

          if (-not $rexglue) { throw 'rexglue.exe was not found in the SDK package.' }
          if (-not $config) { throw 'rexglueConfig.cmake was not found in the SDK package.' }

          $prefix = (Get-Item (Join-Path $config.Directory.FullName '..\..\..')).FullName

          "REXGLUE_EXE=$($rexglue.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$prefix" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $rexglue.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8

          & $rexglue.FullName --version

      - name: Generate ReXGlue project files
        shell: pwsh
        run: |
          & $env:REXGLUE_EXE migrate --app_root "$PWD" --force

          if ($LASTEXITCODE -ne 0) {
            throw 'ReXGlue migrate failed.'
          }

          if (-not (Test-Path 'generated\rexglue.cmake')) {
            throw 'generated/rexglue.cmake was not created.'
          }

      - name: Download your own game XEX
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw 'Missing GAME_DATA_TOKEN secret.'
          }

          $gameDir = Join-Path $env:RUNNER_TEMP 'game-input'
          New-Item -ItemType Directory -Force -Path $gameDir | Out-Null

          gh release download mcla --repo eleduyo/MCLA-GameData --pattern 'default.xex' --dir $gameDir

          if (-not (Test-Path (Join-Path $gameDir 'default.xex'))) {
            throw 'default.xex was not downloaded.'
          }

      - name: Prepare XEX for codegen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'out\build\win-amd64-release\assets' | Out-Null
          Copy-Item "$env:RUNNER_TEMP\game-input\default.xex" 'out\build\win-amd64-release\assets\default.xex' -Force

      - name: Run LARecomp codegen
        shell: pwsh
        run: |
          & $env:REXGLUE_EXE codegen larecomp_manifest.toml

          if ($LASTEXITCODE -ne 0) {
            throw 'LARecomp codegen failed.'
          }

      - name: Configure LARecomp
        shell: pwsh
        run: |
          cmake --preset win-amd64-release -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

          if ($LASTEXITCODE -ne 0) {
            throw 'CMake configure failed.'
          }

      - name: Build LARecomp
        shell: pwsh
        run: |
          cmake --build --preset win-amd64-release --parallel

          if ($LASTEXITCODE -ne 0) {
            throw 'LARecomp build failed.'
          }

      - name: Upload LARecomp
        uses: actions/upload-artifact@v4
        with:
          name: LARecomp-win64
          path: out/build/win-amd64-release
          if-no-files-found: error
